name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check generated identity headers are in sync
        # common/identity/{include/reconclave/identity.h,identity.css} are generated
        # from identity.json by tools/generate_identity.py; fail fast if a change to
        # identity.json was committed without regenerating them.
        run: python3 tools/generate_identity.py --check
      - run: cmake -S . -B build
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - name: Parse JSON protocol artifacts
        run: python3 -m json.tool protocol/schemas/envelope.schema.json >/dev/null && for f in protocol/schemas/*.json protocol/test-vectors/*.json; do python3 -m json.tool "$f" >/dev/null; done
      - name: Validate complete protocol vectors
        run: python3 tools/protocol-debugger/validate_vectors.py protocol/test-vectors/*.json
      - name: Test provisioning and release signatures
        run: python3 -m unittest discover -s tools -p "test_*.py"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Enforce public source policy
        run: python3 tools/check_public_tree.py
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan history with secrets redacted
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact=100'
