[platformio]
default_envs = cardputer_adv

[env:cardputer_adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags =
    --no-stub
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_unflags =
    -DARDUINO_USB_MODE=1
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=1
    -Wall
    -Wextra
    -Wformat=2
lib_extra_dirs =
    ../../common
lib_deps =
    https://github.com/m5stack/M5Cardputer.git#f1392858b9994c3547120e602a57d3553d16ab01
    bblanchon/ArduinoJson@7.4.2
    h2zero/NimBLE-Arduino@2.5.1
    jgromes/RadioLib@7.6.0
    https://github.com/m5stack/M5Unit-NFC.git#93745b547364f310cd64b5155a870103a7800a5d
    m5stack/M5UnitUnified@0.5.5
    m5stack/M5Utility@0.2.0
    m5stack/M5HAL@0.1.2
