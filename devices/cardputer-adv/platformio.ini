[platformio]
default_envs = cardputer_adv

[env:cardputer_adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags =
    --no-stub
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_unflags =
    -DARDUINO_USB_MODE=1
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=1
    -Wall
    -Wextra
    -Wformat=2
lib_extra_dirs =
    ../../common
lib_deps =
    https://github.com/m5stack/M5Cardputer.git#f1392858b9994c3547120e602a57d3553d16ab01
    bblanchon/ArduinoJson@7.4.2
    h2zero/NimBLE-Arduino@2.5.1
