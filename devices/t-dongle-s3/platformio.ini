; LILYGO T-Dongle-S3 - genuine ESP32-S3 (QFN56, rev v0.2), confirmed via
; `esptool chip-id`/`flash-id` against the actual unit: 16MB flash (not the
; 4MB some older docs assume - always trust a real read over a spec sheet).
; No official PlatformIO board entry exists for this board, so - matching
; devices/cardputer-adv's own approach for its M5Stack hardware - this uses
; the generic esp32-s3-devkitc-1 board definition with flash size/partition
; overridden to match reality.
[platformio]
default_envs = t_dongle_s3

[env:t_dongle_s3]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags =
    --no-stub
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_unflags =
    -DARDUINO_USB_MODE=1
    -std=gnu++11
build_flags =
    -std=gnu++17
    ; USB-OTG (TinyUSB) mode, not the default "Hardware CDC and JTAG" mode -
    ; required for USBHIDKeyboard (confirmed via LILYGO's own
    ; examples/usb_hid_keyboard.ino, which errors out at compile time if
    ; ARDUINO_USB_MODE == 1). Serial still works over the same port in this
    ; mode via ARDUINO_USB_CDC_ON_BOOT, same as devices/cardputer-adv.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    ; ARDUINO_USB_CDC_ON_BOOT makes the core call USB.begin() automatically
    ; before setup() runs (so Serial works immediately) - by the time our
    ; own code could call USB.productName()/manufacturerName(), USB is
    ; already started and those setters silently no-op (guarded by
    ; !_started). Setting the descriptor strings at compile time instead
    ; is the only way to override them under CDC-on-boot.
    -DUSB_MANUFACTURER="\"Reconclave\""
    -DUSB_PRODUCT="\"Reconclave T-Dongle-S3\""
    -DCORE_DEBUG_LEVEL=1
    ; TFT_eSPI configuration for this exact hardware, taken verbatim from
    ; Bodmer/TFT_eSPI's own bundled User_Setups/Setup209_LilyGo_T_Dongle_S3.h
    ; (not guessed/derived) and passed as build flags instead of a
    ; User_Setup.h file, since PlatformIO's lib_deps-fetched copy of the
    ; library doesn't carry a project-specific setup selected by default.
    -DUSER_SETUP_LOADED=1
    ; The hang we hit (LED frozen solid right before the first SPI write in
    ; init()) is a documented TFT_eSPI-on-ESP32-S3 symptom traced to the
    ; library's default SPI host choice (FSPI/SPI2) - forcing HSPI/SPI3
    ; instead is the standard workaround. Empirically testing this before
    ; assuming it's the fix.
    -DUSE_HSPI_PORT
    -DST7735_DRIVER
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DST7735_GREENTAB160x80
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_MISO=-1
    -DTFT_MOSI=3
    -DTFT_SCLK=5
    -DTFT_CS=4
    -DTFT_DC=2
    -DTFT_RST=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -Wall
    -Wextra
    -Wformat=2
lib_extra_dirs =
    ../../common
lib_deps =
    fastled/FastLED@3.9.13
    bodmer/TFT_eSPI@2.5.43
