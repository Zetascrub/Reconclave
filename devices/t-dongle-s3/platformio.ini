; LILYGO T-Dongle-S3 — Reconclave FLEET NODE firmware.
;
; This is NOT the standalone ZetaDongle (the offline Malduino-W-style tool that
; was extracted to its own project). This firmware makes the same hardware a
; trust-governed Reconclave node: it speaks reconclave/1, authenticates every
; request with the provisioned HMAC scheme, and exposes HID as a capability the
; coordinator can invoke only under a signed engagement scope with evidence
; logging. Mass storage (MSC) deliberately lives on ZetaDongle, not here.
;
; Generic esp32-s3-devkitc-1 stand-in with flash/partitions overridden to the
; real 16MB, same as the standalone firmware and devices/cardputer-adv.
[platformio]
default_envs = t_dongle_s3

[env:t_dongle_s3]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags =
    --no-stub
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_unflags =
    -DARDUINO_USB_MODE=1
    -std=gnu++11
build_flags =
    -std=gnu++17
    ; USB-OTG (TinyUSB) mode for USBHIDKeyboard; Serial still works via CDC.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DUSB_MANUFACTURER="\"Reconclave\""
    -DUSB_PRODUCT="\"Reconclave T-Dongle-S3 (node)\""
    -DCORE_DEBUG_LEVEL=1
    -Wall
    -Wextra
    -Wformat=2
; Shared Reconclave protocol/domain library (common/protocol).
lib_extra_dirs =
    ../../common
lib_deps =
    fastled/FastLED@3.9.13
    bblanchon/ArduinoJson@7.4.2
